<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>英打遊戲 Version 3</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #0a0a0f;
      color: #f4d7e7;
      text-align: center;
    }

    .container {
      width: min(900px, 90%);
      margin: 0 auto;
      padding: 40px 0;
    }

    h1 {
      margin-bottom: 10px;
    }

    .description {
      color: #aaa;
      margin-bottom: 30px;
    }

    #gameArea {
      position: relative;
      width: 100%;
      height: 400px;
      border: 2px solid #292434;
      background: #10101a;
      overflow: hidden;
      margin-bottom: 25px;
    }

    #letter {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 60px;
      font-weight: bold;
      color: #9f8cff;
    }

    button {
      padding: 12px 30px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #9f8cff;
      color: white;
    }

    button:hover {
      opacity: 0.85;
    }

    #score {
      font-size: 22px;
      margin-bottom: 20px;
    }

    .back {
      display: inline-block;
      margin-top: 30px;
      color: #9f8cff;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>英打遊戲 Version 3</h1>

    <p class="description">
      按下鍵盤上的 A、S、D、F，完成英打練習！
    </p>

    <div id="score">
      分數：<span id="scoreNumber">0</span>
    </div>

    <div id="gameArea">
      <div id="letter">A</div>
    </div>

    <button onclick="startGame()">開始遊戲</button>

    <br>

    <a class="back" href="../index.html">
      ← 回到版本歷史首頁
    </a>

  </div>

  <script>

    const letters = ["A", "S", "D", "F"];

    let currentLetter = "A";
    let score = 0;
    let gameRunning = false;

    const letterElement = document.getElementById("letter");
    const scoreElement = document.getElementById("scoreNumber");

    function newLetter() {

      const randomIndex =
        Math.floor(Math.random() * letters.length);

      currentLetter = letters[randomIndex];

      letterElement.textContent = currentLetter;
    }

    function startGame() {

      score = 0;

      scoreElement.textContent = score;

      gameRunning = true;

      newLetter();
    }

    document.addEventListener("keydown", function(event) {

      if (!gameRunning) {
        return;
      }

      const key = event.key.toUpperCase();

      if (key === currentLetter) {

        score++;

        scoreElement.textContent = score;

        newLetter();
      }

    });

  </script>

</body>
</html>
