<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>英打遊戲版本歷史</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      text-align: center;
      padding: 60px 20px 40px;
    }

    header h1 {
      margin-bottom: 12px;
    }

    header p {
      color: #666;
    }

    .container {
      width: min(1100px, 90%);
      margin: 0 auto 60px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    .card {
      display: block;
      padding: 30px;
      background: white;
      border-radius: 16px;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
    }

    .version {
      color: #777;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .card h2 {
      margin: 0 0 12px;
    }

    .card p {
      line-height: 1.7;
      color: #555;
    }

    .button {
      display: inline-block;
      margin-top: 10px;
      font-weight: bold;
    }

    @media (max-width: 800px) {
      .cards {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>英打遊戲版本歷史</h1>
    <p>記錄英打遊戲從第一版到後續版本的開發過程。</p>
  </header>

  <main class="container">

    <div class="cards">

      <!-- Version 1 -->
      <a
        class="card"
        href="https://241666.github.io/typing-v1/"
        target="_blank"
      >
        <div class="version">VERSION 1</div>
        <h2>英打遊戲版本一</h2>
        <p>
          第一個版本，建立英打遊戲的基本頁面與開始按鈕。
        </p>
        <span class="button">查看 Version 1 →</span>
      </a>

      <!-- Version 2 -->
      <a
        class="card"
        href="https://241666.github.io/typing-v2/"
        target="_blank"
      >
        <div class="version">VERSION 2</div>
        <h2>英打遊戲版本二</h2>
        <p>
          加入鍵盤圖片與開始後播放的音效。
        </p>
        <span class="button">查看 Version 2 →</span>
      </a>

      <!-- Version 3 -->
      <a
        class="card"
        href="coming-soon.html"
      >
        <div class="version">VERSION 3</div>
        <h2>Coming Soon</h2>
        <p>
          下一個版本正在製作中，敬請期待。
        </p>
        <span class="button">即將推出 →</span>
      </a>

    </div>

  </main>

</body>
</html>
