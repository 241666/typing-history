<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>英打遊戲 Version 4</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #030914;
      --bg2: #061426;
      --panel: #081a2d;
      --panel2: #0b2238;

      --blue: #7898b5;
      --blue-light: #a9c0d2;
      --border: #28435c;

      --text: #dce7f0;
      --muted: #71869a;

      --success: #9bb7c9;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family: Arial, "Noto Sans TC", sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 20% 15%,
          rgba(35, 80, 115, 0.20),
          transparent 28%
        ),
        radial-gradient(
          circle at 80% 80%,
          rgba(30, 65, 100, 0.18),
          transparent 30%
        ),
        linear-gradient(
          145deg,
          #020711 0%,
          #061425 48%,
          #030914 100%
        );

      overflow-x: hidden;
    }

    /* 星空 */
    body::before {
      content: "";

      position: fixed;
      inset: 0;

      pointer-events: none;

      opacity: 0.35;

      background-image:
        radial-gradient(
          circle,
          rgba(190, 210, 225, 0.55) 1px,
          transparent 1px
        ),
        radial-gradient(
          circle,
          rgba(120, 155, 180, 0.35) 1px,
          transparent 1px
        );

      background-size:
        100px 100px,
        160px 160px;

      background-position:
        20px 30px,
        70px 90px;
    }

    .page {
      position: relative;
      z-index: 1;

      width: min(1150px, 94%);

      margin: 0 auto;

      padding: 36px 0 50px;
    }

    /* =========================
       Header
    ========================= */

    header {
      text-align: center;

      margin-bottom: 28px;
    }

    .eyebrow {
      color: #61778b;

      font-size: 11px;

      letter-spacing: 4px;

      margin-bottom: 12px;
    }

    h1 {
      margin: 0;

      font-size: clamp(34px, 5vw, 56px);

      letter-spacing: 5px;

      color: #dce7f0;

      text-shadow:
        0 0 15px rgba(130, 165, 190, 0.16);
    }

    .subtitle {
      margin: 12px 0 0;

      color: #71869a;

      font-size: 14px;

      letter-spacing: 1px;
    }

    /* =========================
       Status
    ========================= */

    .status-bar {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 14px;

      margin-bottom: 18px;
    }

    .status {
      background:
        linear-gradient(
          145deg,
          rgba(10, 31, 50, 0.94),
          rgba(5, 18, 32, 0.94)
        );

      border: 1px solid rgba(90, 125, 150, 0.35);

      border-radius: 12px;

      padding: 16px 20px;

      text-align: center;

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.18);
    }

    .status-label {
      color: #657b90;

      font-size: 11px;

      letter-spacing: 3px;

      margin-bottom: 6px;
    }

    .status-value {
      font-size: 25px;

      font-weight: bold;

      color: #d8e4ed;
    }

    /* =========================
       Layout
    ========================= */

    .game-layout {
      display: grid;

      grid-template-columns: 250px 1fr;

      gap: 18px;

      align-items: stretch;
    }

    /* =========================
       Settings
    ========================= */

    .settings {
      background:
        linear-gradient(
          145deg,
          rgba(8, 28, 47, 0.96),
          rgba(5, 19, 33, 0.96)
        );

      border: 1px solid rgba(75, 112, 138, 0.38);

      border-radius: 14px;

      padding: 22px;

      box-shadow:
        0 15px 35px rgba(0, 0, 0, 0.22);
    }

    .settings h2 {
      margin: 0 0 22px;

      font-size: 17px;

      font-weight: 600;

      color: #cbd9e4;
    }

    .setting-group {
      margin-bottom: 24px;
    }

    .setting-title {
      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 10px;

      color: #8195a7;

      font-size: 13px;
    }

    .speed-value {
      color: #b4c6d4;

      font-weight: bold;
    }

    input[type="range"] {
      width: 100%;

      accent-color: #6f8da5;

      cursor: pointer;
    }

    .range-note {
      display: flex;

      justify-content: space-between;

      margin-top: 5px;

      color: #52697c;

      font-size: 11px;
    }

    .checkbox-row {
      display: flex;

      align-items: center;

      gap: 10px;

      color: #8ea2b3;

      font-size: 13px;

      cursor: pointer;
    }

    .checkbox-row input {
      width: 17px;

      height: 17px;

      accent-color: #6f8da5;

      cursor: pointer;
    }

    .mission {
      margin-top: 28px;

      padding-top: 20px;

      border-top: 1px solid #1b3044;
    }

    .mission-label {
      color: #52697c;

      font-size: 10px;

      letter-spacing: 3px;

      margin-bottom: 8px;
    }

    .mission-text {
      color: #788da0;

      font-size: 13px;

      line-height: 1.8;
    }

    /* =========================
       Game Panel
    ========================= */

    .game-panel {
      position: relative;

      min-height: 580px;

      background:
        radial-gradient(
          circle at 50% 100%,
          rgba(45, 85, 120, 0.16),
          transparent 42%
        ),
        #040b15;

      border: 1px solid #2a435c;

      border-radius: 16px;

      overflow: hidden;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.35),
        inset 0 0 80px rgba(70, 100, 130, 0.04);
    }

    .game-panel::before {
      content: "";

      position: absolute;

      inset: 0;

      pointer-events: none;

      opacity: 0.18;

      background-image:
        linear-gradient(
          rgba(120, 150, 175, 0.07) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(120, 150, 175, 0.07) 1px,
          transparent 1px
        );

      background-size: 50px 50px;
    }

    .game-header {
      position: relative;

      z-index: 2;

      padding: 18px 22px;

      border-bottom: 1px solid #172b3e;

      background: rgba(4, 11, 21, 0.82);

      color: #61788c;

      font-size: 11px;

      letter-spacing: 3px;
    }

    #gameArea {
      position: relative;

      height: 440px;

      overflow: hidden;
    }

    /* =========================
       流星字母
    ========================= */

    .letter {
      position: absolute;

      top: -60px;

      width: 52px;
      height: 52px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background:
        radial-gradient(
          circle at 35% 30%,
          #ffffff 0%,
          #c8d7e2 8%,
          #829db2 30%,
          #38536b 65%,
          #142638 100%
        );

      border: 1px solid rgba(190, 215, 230, 0.75);

      color: #f3f7fa;

      font-size: 21px;

      font-weight: bold;

      box-shadow:
        0 0 8px rgba(180, 210, 225, 0.38),
        0 0 22px rgba(100, 145, 175, 0.20);

      user-select: none;

      pointer-events: none;

      z-index: 4;
    }

    /* 流星尾巴 */
    .letter::before {
      content: "";

      position: absolute;

      width: 7px;

      height: 90px;

      left: 50%;

      top: 34px;

      transform: translateX(-50%);

      background:
        linear-gradient(
          to bottom,
          rgba(190, 215, 230, 0.42),
          rgba(110, 150, 180, 0.20),
          transparent
        );

      filter: blur(2px);

      z-index: -1;
    }

    /* 流星淡淡的外圍光 */
    .letter::after {
      content: "";

      position: absolute;

      width: 60px;

      height: 105px;

      left: 50%;

      top: 28px;

      transform: translateX(-50%);

      background:
        linear-gradient(
          to bottom,
          rgba(130, 165, 190, 0.10),
          transparent
        );

      filter: blur(9px);

      z-index: -2;
    }

    .letter.correct {
      opacity: 0;

      transform: scale(1.45);

      filter: brightness(1.35);

      transition: 0.15s;
    }

    /* =========================
       Start Screen
    ========================= */

    .start-screen {
      position: absolute;

      inset: 0;

      z-index: 5;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      background:
        rgba(3, 8, 16, 0.78);

      backdrop-filter: blur(3px);
    }

    .start-screen.hidden {
      display: none;
    }

    .start-title {
      color: #cbd9e4;

      font-size: 25px;

      margin-bottom: 8px;

      letter-spacing: 3px;
    }

    .start-text {
      color: #6f8497;

      font-size: 13px;

      margin-bottom: 25px;
    }

    /* =========================
       Buttons
    ========================= */

    button {
      border: 1px solid #49657d;

      background:
        linear-gradient(
          145deg,
          #142c42,
          #0b1c2d
        );

      color: #dbe6ee;

      padding: 12px 28px;

      border-radius: 8px;

      font-size: 15px;

      font-weight: bold;

      cursor: pointer;

      transition:
        background 0.2s,
        border-color 0.2s,
        transform 0.2s;
    }

    button:hover {
      background:
        linear-gradient(
          145deg,
          #1b3a55,
          #10263a
        );

      border-color: #718da4;

      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }

    .main-button {
      min-width: 150px;

      background:
        linear-gradient(
          145deg,
          #1c3b55,
          #10283c
        );

      border-color: #67839a;
    }

    .pause-button {
      margin-top: 16px;

      background: transparent;

      border-color: #30485d;

      color: #8094a5;
    }

    .pause-button:hover {
      background: #0b1827;
    }

    .game-footer {
      position: relative;

      z-index: 3;

      display: flex;

      justify-content: center;

      gap: 12px;

      padding: 18px;

      border-top: 1px solid #172b3e;

      background: rgba(4, 11, 21, 0.82);
    }

    /* =========================
       Result
    ========================= */

    .result {
      position: absolute;

      inset: 0;

      z-index: 10;

      display: none;

      align-items: center;

      justify-content: center;

      flex-direction: column;

      background:
        rgba(3, 8, 16, 0.95);

      backdrop-filter: blur(5px);
    }

    .result.show {
      display: flex;
    }

    .result h2 {
      margin: 0 0 12px;

      font-size: 28px;

      letter-spacing: 2px;

      color: #d8e4ed;
    }

    .result p {
      margin: 5px 0;

      color: #7d91a3;
    }

    .result strong {
      color: #c2d1dd;
    }

    /* =========================
       Back
    ========================= */

    .back {
      display: inline-block;

      margin-top: 25px;

      color: #71869a;

      text-decoration: none;

      font-size: 13px;

      border-bottom: 1px solid transparent;

      transition: 0.2s;
    }

    .back:hover {
      color: #a7bac9;

      border-bottom-color: #536c80;
    }

    /* =========================
       RWD
    ========================= */

    @media (max-width: 850px) {

      .game-layout {
        grid-template-columns: 1fr;
      }

      .settings {
        order: 2;
      }

      .status-bar {
        grid-template-columns: 1fr;
      }

      #gameArea {
        height: 420px;
      }
    }

    @media (max-width: 520px) {

      .page {
        width: 94%;

        padding-top: 25px;
      }

      h1 {
        font-size: 30px;
      }

      .game-panel {
        min-height: 520px;
      }

      #gameArea {
        height: 360px;
      }

      .letter {
        width: 48px;
        height: 48px;

        font-size: 19px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <header>

      <div class="eyebrow">
        SPACE TYPING PROJECT / V4
      </div>

      <h1>英打遊戲</h1>

      <p class="subtitle">
        在寂靜的宇宙中，完成你的輸入任務。
      </p>

    </header>

    <section class="status-bar">

      <div class="status">

        <div class="status-label">
          QUESTION
        </div>

        <div class="status-value">
          <span id="question">0</span> / 10
        </div>

      </div>

      <div class="status">

        <div class="status-label">
          SCORE
        </div>

        <div
          class="status-value"
          id="score"
        >
          0
        </div>

      </div>

      <div class="status">

        <div class="status-label">
          MISS
        </div>

        <div
          class="status-value"
          id="miss"
        >
          0
        </div>

      </div>

    </section>

    <main class="game-layout">

      <aside class="settings">

        <h2>遊戲設定</h2>

        <div class="setting-group">

          <div class="setting-title">

            <span>落下時間</span>

            <span class="speed-value">
              <span id="speedValue">8</span> 秒
            </span>

          </div>

          <input
            type="range"
            id="speedSlider"
            min="3"
            max="14"
            value="8"
          >

          <div class="range-note">

            <span>快速</span>

            <span>慢速</span>

          </div>

        </div>

        <div class="setting-group">

          <label class="checkbox-row">

            <input
              type="checkbox"
              id="acceleration"
            >

            <span>啟用落下加速</span>

          </label>

        </div>

        <div class="mission">

          <div class="mission-label">
            MISSION
          </div>

          <div class="mission-text">

            使用 A S D F G H J K L ;<br>

            完成 10 個字母輸入。<br><br>

            正確輸入：得分<br>

            錯誤輸入：字母保留<br>

            落到底部：Miss

          </div>

        </div>

      </aside>

      <section class="game-panel">

        <div class="game-header">
          TYPING SPACE / ACTIVE
        </div>

        <div id="gameArea">

          <div
            class="start-screen"
            id="startScreen"
          >

            <div class="start-title">
              SPACE TYPING
            </div>

            <div class="start-text">
              準備開始你的英打任務
            </div>

            <button
              class="main-button"
              id="startBtn"
            >
              開始遊戲
            </button>

          </div>

          <div
            class="result"
            id="result"
          >

            <h2>
              MISSION COMPLETE
            </h2>

            <p>
              最終分數：
              <strong id="finalScore">0</strong>
            </p>

            <p>
              Miss：
              <strong id="finalMiss">0</strong>
            </p>

            <button id="restartBtn">
              再玩一次
            </button>

          </div>

        </div>

        <div class="game-footer">

          <button
            class="pause-button"
            id="pauseBtn"
          >
            暫停
          </button>

        </div>

      </section>

    </main>

    <div style="text-align:center;">

      <a
        class="back"
        href="../index.html"
      >
        ← 返回版本歷史首頁
      </a>

    </div>

  </div>

  <script>

    const letters = [
      "A", "S", "D", "F", "G",
      "H", "J", "K", "L", ";"
    ];

    const gameArea =
      document.getElementById("gameArea");

    const startScreen =
      document.getElementById("startScreen");

    const startBtn =
      document.getElementById("startBtn");

    const pauseBtn =
      document.getElementById("pauseBtn");

    const result =
      document.getElementById("result");

    const restartBtn =
      document.getElementById("restartBtn");

    const scoreEl =
      document.getElementById("score");

    const missEl =
      document.getElementById("miss");

    const questionEl =
      document.getElementById("question");

    const finalScore =
      document.getElementById("finalScore");

    const finalMiss =
      document.getElementById("finalMiss");

    const speedSlider =
      document.getElementById("speedSlider");

    const speedValue =
      document.getElementById("speedValue");

    const accelerationCheckbox =
      document.getElementById("acceleration");

    let score = 0;
    let miss = 0;
    let question = 0;

    let gameRunning = false;
    let paused = false;

    let currentLetter = null;
    let animationFrame = null;

    let startTime = 0;

    let duration = 8000;

    speedSlider.addEventListener(
      "input",
      () => {

        speedValue.textContent =
          speedSlider.value;

        duration =
          Number(speedSlider.value) * 1000;

      }
    );

    startBtn.addEventListener(
      "click",
      startGame
    );

    restartBtn.addEventListener(
      "click",
      startGame
    );

    function startGame() {

      score = 0;

      miss = 0;

      question = 0;

      scoreEl.textContent = score;

      missEl.textContent = miss;

      questionEl.textContent = question;

      result.classList.remove("show");

      startScreen.classList.add("hidden");

      clearLetter();

      gameRunning = true;

      paused = false;

      pauseBtn.textContent = "暫停";

      nextQuestion();
    }

    function nextQuestion() {

      if (!gameRunning) return;

      if (question >= 10) {

        endGame();

        return;
      }

      question++;

      questionEl.textContent =
        question;

      createLetter();
    }

    function createLetter() {

      clearLetter();

      const letter =
        letters[
          Math.floor(
            Math.random() * letters.length
          )
        ];

      const element =
        document.createElement("div");

      element.className = "letter";

      element.textContent = letter;

      const areaWidth =
        gameArea.clientWidth;

      const maxX =
        Math.max(
          10,
          areaWidth - 70
        );

      const x =
        Math.random() * maxX;

      element.style.left =
        x + "px";

      element.style.top =
        "-60px";

      gameArea.appendChild(element);

      currentLetter = {
        element: element,
        value: letter
      };

      startTime =
        performance.now();

      animationFrame =
        requestAnimationFrame(
          updateLetter
        );
    }

    function updateLetter(now) {

      if (!gameRunning) return;

      if (paused) {

        animationFrame =
          requestAnimationFrame(
            updateLetter
          );

        return;
      }

      if (!currentLetter) return;

      const elapsed =
        now - startTime;

      let progress =
        elapsed / duration;

      if (
        accelerationCheckbox.checked
      ) {

        progress =
          Math.pow(
            progress,
            0.7
          );

      }

      const areaHeight =
        gameArea.clientHeight;

      const letterHeight = 54;

      const maxY =
        areaHeight - letterHeight;

      const y =
        progress * maxY;

      currentLetter.element.style.top =
        y + "px";

      /* 流星輕微漂移 */

      const drift =
        Math.sin(
          progress * Math.PI * 3
        ) * 5;

      currentLetter.element.style.transform =
        `translateX(${drift}px)`;

      if (progress >= 1) {

        miss++;

        missEl.textContent =
          miss;

        clearLetter();

        nextQuestion();

        return;
      }

      animationFrame =
        requestAnimationFrame(
          updateLetter
        );
    }

    document.addEventListener(
      "keydown",
      (event) => {

        if (!gameRunning) return;

        if (event.repeat) return;

        if (paused) return;

        if (!currentLetter) return;

        const pressed =
          event.key.toUpperCase();

        if (
          pressed ===
          currentLetter.value
        ) {

          score++;

          scoreEl.textContent =
            score;

          currentLetter.element.classList.add(
            "correct"
          );

          setTimeout(
            () => {

              if (currentLetter) {

                clearLetter();

                nextQuestion();

              }

            },
            100
          );
        }

      }
    );

    pauseBtn.addEventListener(
      "click",
      () => {

        if (!gameRunning) return;

        paused = !paused;

        if (paused) {

          pauseBtn.textContent =
            "繼續";

        } else {

          pauseBtn.textContent =
            "暫停";

          if (currentLetter) {

            const currentTop =
              parseFloat(
                currentLetter
                  .element
                  .style
                  .top
              );

            const areaHeight =
              gameArea.clientHeight;

            const letterHeight = 54;

            const maxY =
              areaHeight -
              letterHeight;

            const progress =
              currentTop /
              maxY;

            startTime =
              performance.now()
              -
              progress *
              duration;

          }

        }

      }
    );

    document.addEventListener(
      "visibilitychange",
      () => {

        if (!gameRunning) return;

        if (document.hidden) {

          if (!paused) {

            paused = true;

            pauseBtn.textContent =
              "繼續";

          }

        }

      }
    );

    function clearLetter() {

      if (animationFrame) {

        cancelAnimationFrame(
          animationFrame
        );

        animationFrame = null;
      }

      if (currentLetter) {

        currentLetter.element.remove();

        currentLetter = null;
      }
    }

    function endGame() {

      gameRunning = false;

      paused = false;

      clearLetter();

      finalScore.textContent =
        score;

      finalMiss.textContent =
        miss;

      result.classList.add("show");

      pauseBtn.textContent =
        "暫停";
    }

  </script>

</body>
</html>
